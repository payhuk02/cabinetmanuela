<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <radialGradient id="haloGold" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="currentColor" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo lumineux -->
  <circle cx="240" cy="240" r="220" fill="url(#haloGold)" stroke="none"/>

  <!-- Couronne / fleuron sommital -->
  <g stroke-width="1.4">
    <path d="M240 8 L246 22 L260 18 L252 32 L266 36 L250 44 L240 60 L230 44 L214 36 L228 32 L220 18 L234 22 Z" fill="currentColor" stroke="none" opacity="0.95"/>
    <circle cx="240" cy="36" r="3" fill="hsl(0 0% 100% / 0.6)" stroke="none"/>
  </g>

  <!-- Anneaux ornementaux supérieurs -->
  <circle cx="240" cy="72" r="10" stroke-width="1.2"/>
  <circle cx="240" cy="72" r="6" stroke-width="0.8" opacity="0.7"/>
  <circle cx="240" cy="72" r="2.5" fill="currentColor" stroke="none"/>

  <!-- Mât central avec double filet -->
  <line x1="240" y1="82" x2="240" y2="430" stroke-width="2.4"/>
  <line x1="236" y1="82" x2="236" y2="430" stroke-width="0.5" opacity="0.55"/>
  <line x1="244" y1="82" x2="244" y2="430" stroke-width="0.5" opacity="0.55"/>

  <!-- Nœud ornemental haut du mât -->
  <g stroke-width="1.1">
    <ellipse cx="240" cy="125" rx="9" ry="5"/>
    <ellipse cx="240" cy="125" rx="4" ry="2.5" fill="currentColor" stroke="none"/>
    <line x1="231" y1="125" x2="249" y2="125" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- Nœud central -->
  <g stroke-width="1">
    <circle cx="240" cy="260" r="6"/>
    <circle cx="240" cy="260" r="2" fill="currentColor" stroke="none"/>
    <path d="M232 260 Q240 250 248 260 Q240 270 232 260 Z" stroke-width="0.6" opacity="0.6"/>
  </g>

  <!-- Fléau (poutre horizontale) — épaissi + filets -->
  <line x1="60" y1="150" x2="420" y2="150" stroke-width="2.2"/>
  <line x1="60" y1="146" x2="420" y2="146" stroke-width="0.5" opacity="0.55"/>
  <line x1="60" y1="154" x2="420" y2="154" stroke-width="0.5" opacity="0.55"/>

  <!-- Pointes ornées extrémités du fléau -->
  <g stroke-width="1.1">
    <path d="M48 150 L60 138 L72 150 L60 162 Z" fill="currentColor" fill-opacity="0.15"/>
    <circle cx="60" cy="150" r="4" fill="currentColor" stroke="none"/>
    <circle cx="60" cy="150" r="7" stroke-width="0.7" opacity="0.7"/>

    <path d="M408 150 L420 138 L432 150 L420 162 Z" fill="currentColor" fill-opacity="0.15"/>
    <circle cx="420" cy="150" r="4" fill="currentColor" stroke="none"/>
    <circle cx="420" cy="150" r="7" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Volutes décoratives au centre du fléau -->
  <g stroke-width="0.9" opacity="0.85">
    <path d="M210 150 Q220 140 230 150"/>
    <path d="M250 150 Q260 140 270 150"/>
    <path d="M210 150 Q220 160 230 150"/>
    <path d="M250 150 Q260 160 270 150"/>
  </g>

  <!-- Chaînes de suspension gauche (3 brins, maillons) -->
  <g stroke-width="0.9">
    <path d="M60 150 L34 248" stroke-dasharray="4 3"/>
    <path d="M60 150 L60 248" stroke-dasharray="4 3"/>
    <path d="M60 150 L86 248" stroke-dasharray="4 3"/>
    <circle cx="47" cy="199" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="60" cy="199" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="73" cy="199" r="1.2" fill="currentColor" stroke="none"/>
  </g>

  <!-- Chaînes de suspension droite -->
  <g stroke-width="0.9">
    <path d="M420 150 L394 248" stroke-dasharray="4 3"/>
    <path d="M420 150 L420 248" stroke-dasharray="4 3"/>
    <path d="M420 150 L446 248" stroke-dasharray="4 3"/>
    <circle cx="407" cy="199" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="420" cy="199" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="433" cy="199" r="1.2" fill="currentColor" stroke="none"/>
  </g>

  <!-- Plateau gauche : coupe galbée premium -->
  <g stroke-width="1.4">
    <path d="M20 248 Q60 296 100 248"/>
    <path d="M26 250 Q60 286 94 250" stroke-width="0.7" opacity="0.65"/>
    <path d="M34 252 Q60 274 86 252" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="60" cy="248" rx="40" ry="5" stroke-width="1.1"/>
    <ellipse cx="60" cy="248" rx="40" ry="2" stroke-width="0.5" opacity="0.6"/>
    <!-- gouttes ornementales -->
    <circle cx="20" cy="248" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="100" cy="248" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="60" cy="296" r="1.8" fill="currentColor" stroke="none"/>
  </g>

  <!-- Plateau droit -->
  <g stroke-width="1.4">
    <path d="M380 248 Q420 296 460 248"/>
    <path d="M386 250 Q420 286 454 250" stroke-width="0.7" opacity="0.65"/>
    <path d="M394 252 Q420 274 446 252" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="420" cy="248" rx="40" ry="5" stroke-width="1.1"/>
    <ellipse cx="420" cy="248" rx="40" ry="2" stroke-width="0.5" opacity="0.6"/>
    <circle cx="380" cy="248" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="460" cy="248" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="420" cy="296" r="1.8" fill="currentColor" stroke="none"/>
  </g>

  <!-- Base ornementale en triangle élégant -->
  <g stroke-width="1.6">
    <path d="M160 430 L240 430 L320 430"/>
    <path d="M170 432 Q240 470 310 432" stroke-width="1"/>
    <path d="M185 434 Q240 458 295 434" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- Volutes baroques de la base -->
  <g stroke-width="0.9" opacity="0.85">
    <path d="M180 430 Q175 420 168 425 Q165 432 172 434"/>
    <path d="M300 430 Q305 420 312 425 Q315 432 308 434"/>
  </g>

  <!-- Socle à gradins -->
  <g stroke-width="2.2">
    <line x1="130" y1="475" x2="350" y2="475"/>
  </g>
  <line x1="142" y1="485" x2="338" y2="485" stroke-width="1.2"/>
  <line x1="158" y1="494" x2="322" y2="494" stroke-width="0.7" opacity="0.75"/>
  <line x1="172" y1="502" x2="308" y2="502" stroke-width="0.5" opacity="0.5"/>

  <!-- Fleurons aux angles du socle -->
  <g fill="currentColor" stroke="none">
    <circle cx="130" cy="475" r="3.5"/>
    <circle cx="350" cy="475" r="3.5"/>
    <circle cx="240" cy="475" r="2"/>
  </g>
  <g stroke-width="0.7" opacity="0.7">
    <circle cx="130" cy="475" r="6"/>
    <circle cx="350" cy="475" r="6"/>
  </g>
</svg>
